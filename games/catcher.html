<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catcher · Level 3 — Dopamine Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="shell">
  <a href="index.html" class="back">⟵ Dopamine Games</a>
  <div class="title"><h1>Catcher</h1><span class="level">Level 3 — catch goods, dodge bombs</span></div>
</header>
<main class="game-page">
  <div class="playfield">
    <canvas id="game" width="640" height="640"></canvas>
    <canvas id="dish" width="220" height="640"></canvas>
  </div>
  <div class="hud">
    <div class="dopamine-row">
      <span class="label">DOPAMINE</span>
      <div class="bar"><div class="fill" id="barFill"></div></div>
      <span id="dopamineText" class="value">0.50</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Caught</span><span id="statCaught" class="value">0</span></div>
      <div class="stat"><span class="label">Misses</span><span id="statMiss" class="value">0</span></div>
      <div class="stat"><span class="label">Bombs hit</span><span id="statBombs" class="value">0</span></div>
      <div class="stat"><span class="label">Epsilon</span><span id="statEps" class="value">1.00</span></div>
    </div>
  </div>
  <div class="controls">
    <button id="btnStart">Start training</button>
    <button id="btnPause">Pause</button>
    <button id="btnReset">Reset brain</button>
    <label class="manual"><input type="checkbox" id="chkManual"> You play (brain watches)</label>
  </div>
  <p class="note">Catch the <span style="color:#4ade80">green goods</span>, dodge the <span style="color:#f87171">red bombs</span>. <b>Good caught = calm beat (+1)</b>, <b>good missed or bomb caught = noise (−1)</b>. Items fall faster as the score rises.</p>
</main>
<script src="shared/audio.js"></script>
<script src="shared/brain.js"></script>
<script src="shared/dish.js"></script>
<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const dish = new NeuronDish(document.getElementById('dish'));
const audio = new DopamineAudio();
const dopamine = new DopamineSystem();
const brain = new DishBrain({ inputSize: 6, outputSize: 3, hiddenSize: 16, lr: 0.025, gamma: 0.95,
  epsilon: 1, epsilonMin: 0.05, epsilonDecay: 0.9993, seed: 31 });

const W = 640, H = 640;
let basket = { w: 72, h: 22, x: W/2 - 36, y: H - 34 };
let items = [];
let spawnTimer = 0;
let score = 0, caught = 0, misses = 0, bombsHit = 0;
let running = false, manual = false, manAction = 1;
const ACT_L = 0, ACT_STAY = 1, ACT_R = 2;
let lastTime = 0, raf = null;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function norm(v, a, b) { return (v - a) / (b - a) * 2 - 1; }

function spawnItem() {
  const good = Math.random() < 0.7;
  items.push({
    x: Math.random() * (W - 26), y: -20, r: 12, vy: 3.2 + score * 0.05,
    type: good ? 'good' : 'bomb', alive: true
  });
  if (items.length > 3) items.shift();
}

function nearestItem() {
  let best = null, bestY = -1;
  for (const it of items) {
    if (!it.alive || it.y >= H) continue;
    if (it.y > bestY) { bestY = it.y; best = it; }
  }
  return best;
}

function getState() {
  const it = nearestItem();
  if (!it) return [ norm(basket.x + basket.w/2, 0, W), -1, -1, -1, 0, -1 ];
  const eta = clamp((H - it.y) / Math.max(it.vy, 0.5), 0, 400) / 400;
  return [ norm(basket.x + basket.w/2, 0, W),
           norm(it.x, 0, W), norm(it.y, 0, H), norm(it.vy, 0, 12),
           it.type === 'good' ? 1 : -1, norm(eta, 0, 1) ];
}

function applyAction(a) {
  const spd = 8;
  if (a === ACT_L) basket.x -= spd;
  else if (a === ACT_R) basket.x += spd;
  basket.x = clamp(basket.x, 0, W - basket.w);
}

function step() {
  const s = getState();
  const a = manual ? manAction : brain.act(s, manual ? 0 : brain.epsilon);
  if (!manual) applyAction(a); else applyAction(manAction);

  let reward = 0;
  spawnTimer++;
  if (spawnTimer > 30 + Math.random() * 40 && items.length < 3) {
    spawnTimer = 0; spawnItem();
  }

  for (const it of items) {
    if (!it.alive) continue;
    it.y += it.vy;

    const catchX = it.x + it.r > basket.x && it.x < basket.x + basket.w;
    if (it.y + it.r > basket.y && catchX) {
      it.alive = false;
      if (it.type === 'good') { reward = 1; caught++; score++; dopamine.hit(); audio.playHit(); dish.hit(); }
      else { reward = -1; bombsHit++; misses++; dopamine.miss(); audio.playMiss(); dish.miss(); }
    } else if (it.y - it.r > H) {
      it.alive = false;
      if (it.type === 'good') { reward = -0.5; misses++; dopamine.miss(); audio.playMiss(); dish.miss(); }
    }
  }
  items = items.filter(it => it.alive && it.y - it.r < H + 20);

  const s2 = getState();
  if (!manual) brain.remember(s, a, reward, s2, false);
  else brain.remember(s, manAction, reward, s2, false);
}

const keys = {};
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') keys.l = true; if (e.key === 'ArrowRight') keys.r = true; });
window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft') keys.l = false; if (e.key === 'ArrowRight') keys.r = false; });
window.addEventListener('pointerdown', () => audio.boot());

function update() {
  if (!running) return;
  for (let i = 0; i < 3; i++) {
    if (manual) manAction = keys.l ? ACT_L : (keys.r ? ACT_R : ACT_STAY);
    step();
  }
  if (brain.memory.length >= brain.minMemory) { brain.trainBatch(); brain.trainBatch(); }
  brain.decayEpsilon();
}

function lerpColor(a, b, t) {
  const parse = c => ({ r: parseInt(c.slice(1, 3), 16), g: parseInt(c.slice(3, 5), 16), b: parseInt(c.slice(5, 7), 16) });
  const ca = parse(a), cb = parse(b);
  return `rgb(${Math.round(ca.r + (cb.r - ca.r) * t)}, ${Math.round(ca.g + (cb.g - ca.g) * t)}, ${Math.round(ca.b + (cb.b - ca.b) * t)})`;
}

function draw() {
  ctx.fillStyle = '#0b1021'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#22d3ee'; ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
  for (const it of items) {
    if (!it.alive) continue;
    ctx.fillStyle = it.type === 'good' ? '#4ade80' : '#f87171';
    ctx.beginPath(); ctx.arc(it.x + it.r, it.y + it.r, it.r, 0, Math.PI * 2); ctx.fill();
  }
  dish.draw(dopamine.tone);
}

function hud() {
  document.getElementById('barFill').style.width = (dopamine.level * 100) + '%';
  document.getElementById('barFill').style.background = lerpColor('#f87171', '#4ade80', dopamine.level);
  document.getElementById('dopamineText').textContent = dopamine.level.toFixed(2);
  document.getElementById('statCaught').textContent = caught;
  document.getElementById('statMiss').textContent = misses;
  document.getElementById('statBombs').textContent = bombsHit;
  document.getElementById('statEps').textContent = brain.epsilon.toFixed(2);
}

function loop(now) {
  if (!lastTime) lastTime = now;
  update(); draw(); hud();
  raf = requestAnimationFrame(loop);
}

document.getElementById('btnStart').onclick = () => { audio.boot(); running = true; lastTime = 0; if (!raf) raf = requestAnimationFrame(loop); };
document.getElementById('btnPause').onclick = () => { running = false; if (raf) cancelAnimationFrame(raf); raf = null; };
document.getElementById('btnReset').onclick = () => {
  running = false; if (raf) cancelAnimationFrame(raf); raf = null;
  brain = new DishBrain({ inputSize: 6, outputSize: 3, hiddenSize: 16, lr: 0.025, gamma: 0.95,
    epsilon: 1, epsilonMin: 0.05, epsilonDecay: 0.9993, seed: Date.now() % 100000 });
  dopamine = new DopamineSystem(); score = 0; caught = 0; misses = 0; bombsHit = 0; items = []; spawnTimer = 0;
  basket.x = W/2 - 36; lastTime = 0;
  running = true; raf = requestAnimationFrame(loop);
};
</script>
</body>
</html>
